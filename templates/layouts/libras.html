<section class="libras-support" aria-labelledby="libras-heading">
  <h2 id="libras-heading">Apoio em Libras</h2>
  <p>Ative o VLibras para traduzir textos desta página. O recurso é fornecido por um serviço externo e a tradução é automática.</p>
  <button type="button" class="btn-portal" data-libras-load>Ativar VLibras</button>
  <button type="button" class="btn-portal" data-libras-hide hidden>Ocultar VLibras</button>
  <p role="status" aria-live="polite" data-libras-status>O portal continua disponível se o serviço estiver fora do ar.</p>
</section>
